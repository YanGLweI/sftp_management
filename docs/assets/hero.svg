<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img" aria-label="SFTP 管理平台：一站式 SFTP 账号管理与服务器安全运维平台">
  <title>SFTP 管理平台：一站式 SFTP 账号管理与服务器安全运维平台</title>
  <defs>
