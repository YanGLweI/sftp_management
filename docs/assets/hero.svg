  <text x="696" y="126" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" fill="#8A94A6">luliya@ChinaUnicom:/</text>
  <line x1="660" y1="140" x2="940" y2="140" stroke="#22364E"/>
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#C6D0DC">
