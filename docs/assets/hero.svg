    <rect x="396" y="352" width="140" height="36" rx="18" fill="none" stroke="#22364E"/>
    <text x="416" y="375" fill="#C6D0DC">50+ 安全基线</text>
  </g>

  <!-- 右侧：双面板浏览器 motif -->
  <!-- 面板 A：文件列表 -->
