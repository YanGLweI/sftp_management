  </defs>

  <!-- 夜空背景 -->
  <rect x="0" y="0" width="1200" height="520" rx="16" fill="#0B1622"/>
  <rect x="0" y="0" width="1200" height="520" rx="16" fill="url(#auroraG)"/>
  <rect x="0" y="0" width="1200" height="520" rx="16" fill="url(#auroraB)"/>

  <!-- 左侧：标题区 -->
  <text x="64" y="118" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" letter-spacing="3" fill="#7CE3B1">SFTP_MANAGEMENT · ACCOUNT &amp; SECURITY OPS</text>
  <text x="64" y="182" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="52" font-weight="700" fill="#F5F7FA">SFTP 管理平台</text>
  <text x="64" y="226" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#C6D0DC">一站式 SFTP 账号管理与服务器安全运维平台</text>

  <text x="64" y="284" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#8A94A6">Go 1.23 · Gin · GORM · MariaDB  |  Vue 2 · Element UI</text>
  <text x="64" y="312" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#8A94A6">JWT + RSA · LDAP/AD · PAM · 50+ 安全基线</text>

  <!-- 关键能力 chips -->
