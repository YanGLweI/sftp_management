<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" role="img" aria-label="系统架构：浏览器经 Vue 前端与 Gin 后端访问 MariaDB、SFTP 服务器、LDAP 与 SMTP，定时任务生成安全报告">
  <title>系统架构：浏览器经 Vue 前端与 Gin 后端访问 MariaDB、SFTP 服务器、LDAP 与 SMTP，定时任务生成安全报告</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A94A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="460" rx="16" fill="#F8FAFC" stroke="#E4E7ED"/>

  <!-- 用户 -->
  <rect x="40" y="160" width="140" height="90" rx="10" fill="#FFFFFF" stroke="#D7DEE8"/>
  <text x="110" y="198" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1F2D3D">运维 / 安全</text>
  <text x="110" y="226" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8A94A6">浏览器</text>
  <line x1="180" y1="205" x2="236" y2="205" stroke="#8A94A6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 前端 -->
  <rect x="240" y="140" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#D7DEE8"/>
  <text x="260" y="176" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1F2D3D">Vue 2 + Element UI</text>
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#5A6B82">
    <text x="260" y="206">RSA 加密登录</text>
    <text x="260" y="230">ECharts 数据看板</text>
    <text x="260" y="254">SFTP 双面板浏览器</text>
  </g>
  <line x1="450" y1="205" x2="496" y2="205" stroke="#8A94A6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 后端 -->
  <rect x="500" y="110" width="250" height="190" rx="10" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
  <text x="520" y="146" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1F2D3D">Gin 后端 (Go 1.23)</text>
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#5A6B82">
    <text x="520" y="178">JWT 鉴权 + 双控验证</text>
    <text x="520" y="204">RBAC 菜单/安全组权限</text>
    <text x="520" y="230">密码策略 / LDAP 配置</text>
    <text x="520" y="256">WebSocket 实时推送</text>
    <text x="520" y="282">pkg/sftp 文件操作</text>
  </g>

  <!-- 后端到右侧服务 -->
  <line x1="750" y1="150" x2="816" y2="95" stroke="#8A94A6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="190" x2="816" y2="190" stroke="#8A94A6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="230" x2="816" y2="285" stroke="#8A94A6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 服务列 -->
  <rect x="820" y="60" width="330" height="70" rx="10" fill="#FFFFFF" stroke="#D7DEE8"/>
  <text x="840" y="90" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#1F2D3D">MariaDB</text>
  <text x="840" y="116" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#5A6B82">GORM AutoMigrate · 表前缀 t_</text>

  <rect x="820" y="155" width="330" height="70" rx="10" fill="#FFFFFF" stroke="#D7DEE8"/>
  <text x="840" y="185" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#1F2D3D">SFTP 服务器</text>
  <text x="840" y="211" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#5A6B82">系统账号 · 路径防护 · 操作日志</text>

  <rect x="820" y="250" width="330" height="70" rx="10" fill="#FFFFFF" stroke="#D7DEE8"/>
  <text x="840" y="280" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#1F2D3D">LDAP / AD</text>
  <text x="840" y="306" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#5A6B82">TLS 加密 · 安全组权限（数据库配置）</text>

  <rect x="820" y="345" width="330" height="70" rx="10" fill="#FFFFFF" stroke="#D7DEE8"/>
  <text x="840" y="375" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#1F2D3D">SMTP 邮件</text>
  <text x="840" y="401" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#5A6B82">HTML 安全报告推送</text>

  <!-- 定时任务带 -->
  <rect x="240" y="345" width="510" height="70" rx="10" fill="#0B1622"/>
  <text x="260" y="375" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#7CE3B1">定时调度 (cron)</text>
  <text x="260" y="401" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#C6D0DC">加固 50+ 项 · DNF 更新 · 卡巴斯基 → HTML 报告</text>
  <line x1="750" y1="380" x2="816" y2="380" stroke="#8A94A6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="625" y1="300" x2="625" y2="341" stroke="#8A94A6" stroke-width="2" marker-end="url(#arr)"/>
</svg>
